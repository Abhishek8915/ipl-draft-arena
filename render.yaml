services:
  - type: web
    name: ipl-draft-arena-server
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci && npm run build:server
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: CLIENT_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ROOM_TTL_MINUTES
        value: "60"
